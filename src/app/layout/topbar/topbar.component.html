<div class="container">
  <div class="headerContainer" [class.scrolled]="isScrolled">
    <mat-toolbar class="header">
      <div class="headerLogo">
        <a href="#home" class="logo-link">
          <span class="logo-text">RJ</span>
        </a>
      </div>

      <span class="spacer"></span>

      <div class="navItems" *ngIf="!isMobile">
        <nav>
          <ul>
            <li><a href="#home" (click)="setActive('home')">Home</a></li>
            <li><a href="#about" (click)="setActive('about')">About</a></li>
            <li><a href="#projects" (click)="setActive('projects')">Projects</a></li>
            <li><a href="#contact" (click)="setActive('contact')">Contact</a></li>
            <li *ngIf="isLogin()"><a routerLink="/dashboard" (click)="setActive('dashboard')">Dashboard</a></li>
            <li *ngIf="!isLogin()"><a routerLink="/login" (click)="setActive('login')" class="nav-btn">Login</a></li>
            <li *ngIf="isLogin()"><a (click)="logout(); setActive('logout')" class="nav-btn">Logout</a></li>
          </ul>
        </nav>
      </div>

      <!-- MENU button for mobile -->
      <div
        class="menu-toggle cursor-hover-target"
        (click)="toggleSidenav()"
        *ngIf="isMobile"
      >
        <span class="menu-label">{{ isMenuOpen ? 'CLOSE' : 'MENU' }}</span>
        <div class="menu-dot" [class.active]="isMenuOpen"></div>
      </div>
    </mat-toolbar>
  </div>
</div>
