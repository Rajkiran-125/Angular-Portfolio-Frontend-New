<div class="sidebarContainer">
  <app-topbar (sidenavToggle)="drawer.toggle()" Responsive></app-topbar>
  <mat-drawer-container class="drawerContainer" hasBackdrop="true">
    <mat-drawer class="mobileDrawer" #drawer mode="over" position="end">
      <div class="drawerInfo">
        <ul (click)="toggle()">
          <li><a href="#home"><span class="nav-num">01.</span> Home</a></li>
          <li><a href="#about"><span class="nav-num">02.</span> About</a></li>
          <li><a href="#projects"><span class="nav-num">03.</span> Projects</a></li>
          <li><a href="#contact"><span class="nav-num">04.</span> Contact</a></li>
          <li *ngIf="isLogin()"><a routerLink="/dashboard">Dashboard</a></li>
          <li *ngIf="!isLogin()"><a routerLink="/login">Login</a></li>
          <li *ngIf="isLogin()"><a routerLink="/login" (click)="logout();">Logout</a></li>
        </ul>
      </div>
    </mat-drawer>
    <mat-drawer-content>
      <div id="home">
        <app-home Responsive></app-home>
      </div>
      <div id="about">
        <app-about Responsive></app-about>
      </div>
      <div id="resume">
        <app-resume Responsive></app-resume>
      </div>
      <div id="projects">
        <app-projects Responsive></app-projects>
      </div>
      <div id="contact">
        <app-contact Responsive></app-contact>
      </div>
      <app-footer Responsive></app-footer>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
