<footer class="footer">
  <div class="footer-container">
    <div class="footer-content" data-aos="fade-up" data-aos-delay="100" data-aos-once="true">
      <!-- Logo -->
      <div class="footer-logo">
        <span class="logo-bracket">&lt;</span>
        <span class="logo-name">Rajkiran Jaiswar</span>
        <span class="logo-bracket"> /&gt;</span>
      </div>

      <!-- Social icons -->
      <div class="footer-socials">
        <a class="social-btn" (click)="redirectToLinkdin()" title="LinkedIn">
          <i class="bx bxl-linkedin"></i>
        </a>
        <a class="social-btn" (click)="redirectToGithub()" title="GitHub">
          <i class="bx bxl-github"></i>
        </a>
        <a class="social-btn" (click)="redirectToInsta()" title="Instagram">
          <i class="bx bxl-instagram-alt"></i>
        </a>
      </div>

      <!-- Divider -->
      <div class="footer-divider"></div>

      <!-- Back to top -->
      <div class="back-to-top" (click)="scrollToTopWithDelay(100)">
        <div class="top-btn">
          <i class="bx bx-chevron-up"></i>
        </div>
        <span class="top-text">Back to Top</span>
      </div>

      <!-- Copyright -->
      <div class="footer-copyright">
        <p>Designed & Built by <span class="highlight">Rajkiran Jaiswar</span></p>
        <p class="copyright-year">&copy; 2024 All Rights Reserved.</p>
      </div>
    </div>
  </div>
</footer>
