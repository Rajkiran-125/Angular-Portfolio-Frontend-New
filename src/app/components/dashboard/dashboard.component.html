<app-loader *ngIf="loader"></app-loader>

<div class="dashboard-page">
  <!-- Background -->
  <div class="dashboard-bg">
    <div class="grid-pattern"></div>
  </div>

  <!-- Back to home -->
  <a href="/" class="back-link">
    <i class="bx bx-arrow-back"></i>
    <span>Back to Portfolio</span>
  </a>

  <div class="dashboard-container">
    <div class="dashboard-header">
      <h1 class="dashboard-title">
        <span class="gradient-text">Dashboard</span>
      </h1>
      <p class="dashboard-subtitle">Contact form submissions</p>
    </div>

    <div class="table-wrapper glass-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Contact</th>
              <th>Email</th>
              <th>Subject</th>
              <th>Message</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let contact of contactList">
              <td>{{contact.FullName}}</td>
              <td>{{contact.ContactNumber}}</td>
              <td>{{contact.Email}}</td>
              <td>{{contact.Subject}}</td>
              <td class="message-cell">{{contact.Message}}</td>
              <td>
                <button class="delete-btn" (click)="deleteContact(contact.Id)">
                  <i class="bx bx-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="!contactList || contactList.length === 0">
              <td colspan="6" class="empty-state">
                <i class="bx bx-inbox"></i>
                <span>No submissions yet</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
