<section class="hero">
  <div class="hero-container">
    <!-- Top meta row -->
    <div class="hero-meta" data-aos="fade-down" data-aos-delay="200" data-aos-once="true" data-aos-offset="0">
      <span class="meta-left">Full-Stack Software Engineer</span>
      <span class="meta-center"><strong>3+</strong> Years of Experience</span>
      <span class="meta-right">Mumbai, India</span>
    </div>

    <!-- Main display typography -->
    <div class="hero-display">
      <h1 class="display-line line-1" data-aos="fade-up" data-aos-delay="400" data-aos-once="true" data-aos-offset="0">
        <span class="display-word">BUILT</span>
        <span class="display-word serif-italic">in</span>
        <span class="display-word highlight-code">CODE</span>
      </h1>
      <h1 class="display-line line-2" data-aos="fade-up" data-aos-delay="600" data-aos-once="true" data-aos-offset="0">
        <span class="display-word">DESIGNED</span>
        <span class="display-word serif-italic">for</span>
        <span class="display-word">HUMANS</span>
      </h1>
      <div class="display-underline" data-aos="fade-right" data-aos-delay="800" data-aos-once="true" data-aos-offset="0"></div>
    </div>

    <!-- Description row -->
    <div class="hero-bottom">
      <div class="hero-description" data-aos="fade-up" data-aos-delay="900" data-aos-once="true" data-aos-offset="0">
        <p>
          I build things for the web. Passionate and skilled Software Engineer,
          always curious to learn more when it comes to new technologies and creative coding.
        </p>
      </div>

      <div class="hero-actions" data-aos="fade-up" data-aos-delay="1000" data-aos-once="true" data-aos-offset="0">
        <button class="btn-primary" (click)="redirectToProject()">
          <span>View Projects</span>
          <i class="bx bx-right-arrow-alt"></i>
        </button>
        <button class="btn-outline" (click)="redirectToResume()">
          <i class="bx bx-download"></i>
          <span>Resume</span>
        </button>
      </div>
    </div>

    <!-- Photo (desktop only) -->
    <div class="hero-photo" *ngIf="isMobile" data-aos="fade-left" data-aos-delay="800" data-aos-once="true" data-aos-offset="0">
      <div class="photo-frame">
        <img src="assets/img/new_bg2.jpg" alt="Rajkiran Jaiswar" />
      </div>
    </div>
  </div>

  <!-- Side elements (desktop) -->
  <div class="side-email" *ngIf="isMobile">
    <a href="mailto:rajjaiswar1256@gmail.com">rajjaiswar1256&#64;gmail.com</a>
    <div class="side-line"></div>
  </div>

  <div class="side-socials" *ngIf="isMobile">
    <a (click)="redirectToLinkdin()" class="cursor-hover-target"><i class="bx bxl-linkedin"></i></a>
    <a (click)="redirectToGithub()" class="cursor-hover-target"><i class="bx bxl-github"></i></a>
    <a (click)="redirectToInsta()" class="cursor-hover-target"><i class="bx bxl-instagram-alt"></i></a>
    <div class="side-line"></div>
  </div>

  <!-- Scroll indicator -->
  <div class="scroll-indicator" (click)="redirectToAbout()">
    <div class="mouse">
      <div class="wheel"></div>
    </div>
    <span class="scroll-text">Scroll</span>
  </div>

  <!-- Social links (mobile) -->
  <div class="mobile-socials" *ngIf="!isMobile" data-aos="fade-up" data-aos-delay="1200" data-aos-once="true" data-aos-offset="0">
    <a class="social-link cursor-hover-target" (click)="redirectToLinkdin()" title="LinkedIn">
      <i class="bx bxl-linkedin"></i>
    </a>
    <a class="social-link cursor-hover-target" (click)="redirectToGithub()" title="GitHub">
      <i class="bx bxl-github"></i>
    </a>
    <a class="social-link cursor-hover-target" (click)="redirectToInsta()" title="Instagram">
      <i class="bx bxl-instagram-alt"></i>
    </a>
  </div>
</section>
